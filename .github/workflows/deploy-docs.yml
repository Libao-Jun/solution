name: Solution Docs # 工作流名称，在 Actions 页面显示

# 触发条件配置
on:
  push:
    branches: [main] # 仅在推送到 main 分支时触发
  workflow_dispatch: # 支持在 Actions 页面手动触发（首次建站 / 重新发布时用）

# 权限配置：赋予 GITHUB_TOKEN 必要的权限
permissions:
  contents: read # 允许读取仓库内容
  pages: write # 允许写入 GitHub Pages
  id-token: write # 允许验证身份令牌

# 并发控制：防止多次连续推送导致部署冲突
concurrency:
  group: pages # 将所有部署任务归为一组
  cancel-in-progress: false # 有正在进行的部署时排队等待，不取消

jobs:
  # 部署任务
  deploy:
    # 设置部署环境，用于在仓库主页显示部署状态与链接
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # 指定运行环境为最新版的 Ubuntu
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码（v4→v7：v4 声明 runs.using: node20，而 Node 20 已于 2026-09-23 从 GitHub 托管
      #    runner 中移除，旧版本 action 会因找不到 node20 运行时在 Set up job 阶段报
      #    "Interpreter not found"）
      - uses: actions/checkout@v7

      # 2. 安装 pnpm 包管理器（版本与 package.json 的 packageManager 保持一致）
      #    v4→v6：同因，v4 的 runs.using 仍为 node20
      - uses: pnpm/action-setup@v6
        with:
          version: 10.19.0

      # 3. 安装 Node.js 环境（vite 7 要求 ^20.19.0 || >=22.12.0）
      #    v4→v7：v4 的 runs.using 仍为 node20
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm' # 启用 pnpm 依赖缓存，加快构建速度

      # 4. 安装项目依赖（CI 下按 lockfile 严格安装，不更新版本）
      - run: pnpm install --frozen-lockfile

      # 5. 构建站点（对应 package.json 中的 build 脚本，产物在 .vitepress/dist）
      - run: pnpm run build

      # 6. 配置 GitHub Pages 环境（自动处理 Jekyll 等设置）
      #    前提：仓库 Settings → Pages → Build and deployment → Source 必须选 "GitHub Actions"，
      #    否则该步骤调用 REST GET /repos/{owner}/{repo}/pages 会返回 404：
      #    "Get Pages site failed ... Error: Not Found"
      #    v5→v6：v5 的 runs.using 仍为 node20
      - uses: actions/configure-pages@v6

      # 7. 上传构建产物（v3→v5：v3 内部仍依赖 node20 版本的 upload-artifact）
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .vitepress/dist

      # 8. 部署到 GitHub Pages（v4→v5：v4 的 runs.using 仍为 node20）
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
